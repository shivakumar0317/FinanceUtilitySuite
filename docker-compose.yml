services:
  postgres:
    image: postgres:17-alpine
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_utility_suite
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finance_user -d finance_utility_suite"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finance_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: Finance Utility Suite
      APP_VERSION: 1.7.0-alpha
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://finance_user:finance_password@postgres:5432/finance_utility_suite
      JWT_SECRET_KEY: change-this-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"

volumes:
  finance_postgres_data:
